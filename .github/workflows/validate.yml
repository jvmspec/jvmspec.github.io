name: Validate and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate presentation site
        run: npm run validate
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-site-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: static-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html 404.html LICENSE .nojekyll robots.txt sitemap.xml site.webmanifest _site/
          cp -R assets _site/assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
